[package]
name = "proofforge-phoenix-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Phoenix application Mollusk gates, split from runtime-tests/solana so the svm CI
# lane does not pay the Phoenix test cost. Shares `tests/common` with the solana
# crate via a #[path] reference (same directory depth keeps `../../build/sbpf`
# artifact resolution working).

[dependencies]
base64 = "0.22"
bytemuck = { version = "=1.25.2", features = ["derive"] }
hex = "0.4"
lib-sokoban = "=0.3.0"
mollusk-svm = "0.13.4"
mollusk-svm-programs-token = "0.13.4"
sha2 = "0.10"
solana-account = "3.4.0"
solana-instruction = "3.3.0"
solana-native-token = "3.0.0"
solana-program-error = "3.0.0"
solana-pubkey = "4.1.0"
solana-svm-log-collector = { version = "4.0.0", features = ["agave-unstable-api"] }
spl-token-interface = "2.0.0"
