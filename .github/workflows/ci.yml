name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Cancel superseded PR runs only. Pushes to main must each finish so every main
# commit keeps a completed CI result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lean/SVM/EVM/NEAR run on every main push and dispatch, and on PRs whose own or `shared` paths match.
  # Phoenix runs only on `phoenix`/`phoenix_codegen` paths, a `phoenix` PR label, or dispatch; ci-phoenix.yml covers it nightly.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      lean: ${{ steps.gate.outputs.lean }}
      svm: ${{ steps.gate.outputs.svm }}
      evm: ${{ steps.gate.outputs.evm }}
      near: ${{ steps.gate.outputs.near }}
      phoenix: ${{ steps.gate.outputs.phoenix }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - '.github/workflows/ci.yml'
              - '.agents/setup'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - 'ProofForge/Cli.lean'
              - 'ProofForge/Attr.lean'
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
              - 'ProofForge/Crypto/**'
              - 'ProofForge/Profile.lean'
            lean:
              - 'ProofForge/**'
              - 'Tests/**'
              - 'Tests.lean'
              - 'Examples/**'
              - 'Examples.lean'
              - 'scripts/check_*.py'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
              - '.agents/setup'
            svm:
              - 'ProofForge/Svm/**'
              - 'Examples/Svm/**'
              - 'runtime-tests/solana/**'
              - 'runtime-tests/surfpool/**'
              - 'scripts/check_ownership.py'
              - 'scripts/check_no_sorry.py'
              - 'scripts/check_artifact_manifest.py'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
              - '.agents/setup'
              - 'ProofForge/Cli.lean'
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
            evm:
              - 'ProofForge/Evm/**'
              - 'ProofForge/Wasm/**'
              - 'Examples/Evm/**'
              - 'Examples/Xrpl/**'
              - 'runtime-tests/evm/**'
              - 'runtime-tests/xrpl/**'
              - 'scripts/check_artifact_manifest.py'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
              - '.agents/setup'
              - 'ProofForge/Cli.lean'
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
            near:
              - 'ProofForge/Wasm/**'
              - 'Examples/Near/**'
              - 'runtime-tests/near/**'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'
              - '.github/workflows/ci.yml'
              - '.agents/setup'
              - 'ProofForge/Cli.lean'
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
            # Phoenix application surface: examples, spec gates, its own Mollusk crate,
            # shared test helpers, Surfpool deploy scripts, and the SVM emit paths whose
            # changes can move Phoenix digests. Drives the dedicated phoenix lane.
            phoenix:
              - 'Examples/Svm/Phoenix.lean'
              - 'Examples/Svm/PhoenixV1Layout.lean'
              - 'Examples/Svm/PhoenixV1Profile.lean'
              - 'Tests/PhoenixBuildSpec.lean'
              - 'Tests/PhoenixSpec.lean'
              - 'Tests/PhoenixV1ProfileSpec.lean'
              - 'ProofForge/Svm/AccountStorage/**'
              - 'ProofForge/Svm/FifoCancel/**'
              - 'ProofForge/Svm/BatchRecorder/**'
              - 'ProofForge/Svm/Emit.lean'
              - 'runtime-tests/phoenix/**'
              - 'runtime-tests/solana/tests/common/**'
              - 'runtime-tests/surfpool/**'
            phoenix_codegen:
              - 'ProofForge/Extract.lean'
              - 'ProofForge/Extract/**'
              - 'ProofForge/Core/**'
              - 'ProofForge/Svm/Emit.lean'
              - 'ProofForge/Svm/IR.lean'
              - 'ProofForge/Svm/Ops.lean'
              - 'ProofForge/Svm/Component/**'
              - 'ProofForge/Svm/EntryAdapter/**'
              - 'ProofForge/Svm/EntryAdapter.lean'
              - 'lakefile.lean'
              - 'lean-toolchain'
              - 'lake-manifest.json'

      - name: Publish lane gates
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHARED: ${{ steps.filter.outputs.shared }}
          LEAN: ${{ steps.filter.outputs.lean }}
          SVM: ${{ steps.filter.outputs.svm }}
          EVM: ${{ steps.filter.outputs.evm }}
          NEAR: ${{ steps.filter.outputs.near }}
          PHOENIX: ${{ steps.filter.outputs.phoenix }}
          PHOENIX_CODEGEN: ${{ steps.filter.outputs.phoenix_codegen }}
          PHOENIX_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'phoenix') }}
        run: |
          set -euo pipefail
          any_true() {
            local v
            for v in "$@"; do
              if [ "$v" = "true" ]; then
                echo true
                return
              fi
            done
            echo false
          }
          lane_gates() {
            local all_lanes=false dispatch=false
            [ "$EVENT_NAME" = "pull_request" ] || all_lanes=true
            [ "$EVENT_NAME" != "workflow_dispatch" ] || dispatch=true
            echo "lean=$(any_true "$all_lanes" "$SHARED" "$LEAN")"
            echo "svm=$(any_true "$all_lanes" "$SHARED" "$SVM")"
            echo "evm=$(any_true "$all_lanes" "$SHARED" "$EVM")"
            echo "near=$(any_true "$all_lanes" "$SHARED" "$NEAR")"
            echo "phoenix=$(any_true "$dispatch" "$PHOENIX" "$PHOENIX_CODEGEN" "$PHOENIX_LABEL")"
          }
          lane_gates | tee -a "$GITHUB_OUTPUT"

  lean:
    name: Lean
    needs: changes
    if: needs.changes.outputs.lean == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Check Runtime / SDK ownership boundaries
        run: python3 scripts/check_ownership.py

      - name: Check SDK import-closure (no Emit/Assemble/Registry)
        run: python3 scripts/check_sdk_import_closure.py

      - name: Check artifact manifest
        run: python3 scripts/check_artifact_manifest.py --self-test

      - name: Check kernel proofs have no placeholders
        run: python3 scripts/check_no_sorry.py

      - name: Build Lean libraries
        run: lake build

      - name: Build formalization gate modules
        run: |
          lake build ProofForgeSvmSdk ProofForgeEvmSdk
          lake build Tests.ProofSpec Tests.SolanalibSpec Tests.SemanticsSpec

      - name: Build Lean test suite
        run: lake build Tests

      # Save only from main so PR runs do not evict the toolchain cache.
      - name: Save Lean build products
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Check EVM Yul fragment audit (E-B1)
        run: python3 scripts/check_yul_fragment.py --self-test

      - name: Build powdr-probe (EVM Feature B, fast lane)
        run: ./scripts/build_powdr_probe.sh

  svm:
    name: SVM
    needs: changes
    if: needs.changes.outputs.svm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Cache Rust build products
        uses: actions/cache@v4
        with:
          path: runtime-tests/solana/target
          key: mollusk-${{ runner.os }}-${{ hashFiles('runtime-tests/solana/Cargo.lock', 'runtime-tests/solana/Cargo.toml') }}
          restore-keys: mollusk-${{ runner.os }}-

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Check Runtime / SDK ownership boundaries
        run: python3 scripts/check_ownership.py

      - name: Check kernel proofs have no placeholders
        run: python3 scripts/check_no_sorry.py

      - name: Build program source modules
        run: lake build Examples

      - name: Build all SVM programs
        run: lake exe pf -- build --target svm --out build/sbpf

      - name: Check SVM artifact manifest
        run: python3 scripts/check_artifact_manifest.py --target svm --out build/sbpf

      - name: Run Mollusk integration suite
        run: cargo test --locked --manifest-path runtime-tests/solana/Cargo.toml

      - name: Deploy packed entry adapter fixture through Surfpool Loader-v3
        timeout-minutes: 15
        run: runtime-tests/surfpool/smoke.sh RawEntry

  phoenix:
    name: Phoenix
    needs: changes
    if: needs.changes.outputs.phoenix == 'true'
    runs-on: ubuntu-24.04
    # PR wall budget: Lean + Mollusk + Phoenix Surfpool. PhoenixV1Profile Surfpool
    # (~10MB ELF) lives in ci-phoenix.yml nightly — it timed out at 45m on PR runners.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Cache Rust build products
        uses: actions/cache@v4
        with:
          path: runtime-tests/phoenix/target
          key: mollusk-phoenix-${{ runner.os }}-${{ hashFiles('runtime-tests/phoenix/Cargo.lock', 'runtime-tests/phoenix/Cargo.toml') }}
          restore-keys: mollusk-phoenix-${{ runner.os }}-

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-phoenix-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-phoenix-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build Phoenix sources and spec gates
        run: lake build PhoenixExamples PhoenixTests

      - name: Build Phoenix programs
        run: lake exe pf -- build --target svm --module Examples.Svm.Phoenix --module Examples.Svm.PhoenixV1Profile --out build/sbpf

      # Save only from main so PR runs do not evict the toolchain cache.
      - name: Save Lean build products
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-phoenix-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Run Phoenix Mollusk suite
        run: cargo test --locked --manifest-path runtime-tests/phoenix/Cargo.toml

      - name: Deploy Phoenix through Surfpool Loader-v3
        timeout-minutes: 15
        run: runtime-tests/surfpool/smoke.sh Phoenix

  evm:
    name: EVM
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.foundry
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup') }}

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build program source modules
        run: lake build Examples

      - name: Build all EVM programs
        run: lake exe pf -- build --target evm --out build/evm

      - name: Check EVM artifact manifest
        run: python3 scripts/check_artifact_manifest.py --target evm --out build/evm

      - name: Build all XRPL programs
        run: lake exe pf -- build --target xrpl --out build/xrpl

      - name: Run XRPL Bedrock wasm gate
        run: runtime-tests/xrpl/check.sh

      - name: Run XRPL local-node Counter gate
        run: runtime-tests/xrpl/counter.sh

      - name: Run XRPL local-node XrplCtx gate
        run: runtime-tests/xrpl/ctx.sh

      - name: Run XRPL local-node XrplOwn gate
        run: runtime-tests/xrpl/own.sh

      - name: Run XRPL local-node XrplHash gate
        run: runtime-tests/xrpl/hash.sh

      - name: Run XRPL local-node XrplRt2 gate
        run: runtime-tests/xrpl/rt2.sh

      - name: Run XRPL local-node XrplVec gate
        run: runtime-tests/xrpl/vec.sh

      - name: Run Anvil integration suite
        run: runtime-tests/evm/anvil.sh

  near:
    name: NEAR
    needs: changes
    if: needs.changes.outputs.near == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchains and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cargo/bin
            ~/.cargo/git
            ~/.cargo/registry
            ~/.rustup
            ~/.foundry
            ~/.local/bin
            .lake/packages
            runtime-tests/near/.venv
          key: near-toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', '.agents/setup', 'runtime-tests/near/requirements.txt') }}

      - name: Prepare pinned toolchains
        run: |
          ./.agents/setup
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Align with ci-001 / SVM+EVM: do NOT recompile the full Tests aggregate.
      # Lean lane already owns `lake build` + `lake build Tests`.
      - name: Build program source modules
        run: lake build Examples

      - name: Build all NEAR programs
        run: lake exe pf -- build --target near --out build/near

      - name: Run NEAR wasm gate
        run: runtime-tests/near/check.sh

      - name: Run NEAR sandbox Counter gate
        run: runtime-tests/near/counter.sh

      - name: Run NEAR sandbox Context gate
        run: runtime-tests/near/context.sh

      - name: Run NEAR sandbox Borsh bytes gate
        run: runtime-tests/near/bytes.sh

      - name: Run NEAR sandbox NEP-141 event gate
        run: runtime-tests/near/ft_event.sh

      - name: Run NEAR sandbox checked u128 gate
        run: runtime-tests/near/token_arithmetic.sh

      - name: Run NEAR sandbox Borsh u128 storage-value gate
        run: runtime-tests/near/token_storage.sh

      - name: Run NEAR sandbox memory arena gate
        run: runtime-tests/near/memory.sh

      - name: Run NEAR sandbox Borsh, JSON-u128, JSON-null, and bounded ft_metadata output gate
        run: runtime-tests/near/output.sh

      - name: Run NEAR sandbox StorageBalance option JSON output gate
        run: runtime-tests/near/storage_balance_output.sh

      - name: Run NEAR sandbox StorageBalanceBounds JSON output gate
        run: runtime-tests/near/storage_balance_bounds_output.sh

      - name: Run NEAR sandbox bounded AccountId JSON input gate
        run: runtime-tests/near/json_account_input.sh

      - name: Run NEAR sandbox canonical quoted-u128 amount JSON input gate
        run: runtime-tests/near/json_amount_input.sh

      - name: Run NEAR sandbox optional bounded memo JSON input gate
        run: runtime-tests/near/json_memo_input.sh

      - name: Run NEAR sandbox required bounded message JSON input gate
        run: runtime-tests/near/json_message_input.sh

      - name: Run NEAR sandbox combined bounded FT transfer argument gate
        run: runtime-tests/near/json_ft_transfer_input.sh

      - name: Run NEAR sandbox combined bounded FT transfer-call argument gate
        run: runtime-tests/near/json_ft_transfer_call_input.sh

      - name: Run NEAR sandbox bounded FT receiver argument gate
        run: runtime-tests/near/json_ft_on_transfer_input.sh

      - name: Run NEAR sandbox immediate-value FT receiver gate
        run: runtime-tests/near/ft_receiver_value.sh

      - name: Run NEAR sandbox Promise-or-U128 terminal gate
        run: runtime-tests/near/promise_or_value.sh

      - name: Run NEAR sandbox bounded FT resolver argument gate
        run: runtime-tests/near/json_ft_resolve_input.sh

      - name: Run NEAR sandbox bounded storage-deposit argument gate
        run: runtime-tests/near/json_storage_deposit_input.sh

      - name: Run NEAR sandbox bounded storage-unregister argument gate
        run: runtime-tests/near/json_storage_unregister_input.sh

      - name: Run NEAR sandbox bounded storage-withdraw argument gate
        run: runtime-tests/near/json_storage_withdraw_input.sh

      - name: Run NEAR sandbox mutating JSON Boolean output gate
        run: runtime-tests/near/json_boolean_mutation.sh

      - name: Run NEAR sandbox raw storage gate
        run: runtime-tests/near/storage.sh

      - name: Run NEAR sandbox storage economics gate
        run: runtime-tests/near/storage_economics.sh

      - name: Run NEAR sandbox closed storage-registration gate
        run: runtime-tests/near/storage_registration.sh

      - name: Run NEAR sandbox direct Vector gate
        run: runtime-tests/near/vector.sh

      - name: Run NEAR sandbox direct LookupMap/LookupSet gate
        run: runtime-tests/near/lookup.sh

      - name: Run NEAR sandbox closed fungible-ledger gate
        run: runtime-tests/near/ledger.sh

      - name: Run NEAR sandbox bounded Queue gate
        run: runtime-tests/near/queue.sh

      - name: Run NEAR sandbox Identity IterableMap/IterableSet gate
        run: runtime-tests/near/iterable.sh

      - name: Run NEAR sandbox detached Promise function-call gate
        run: runtime-tests/near/promise.sh

  # Required-check identity. Intentionally-skipped lanes (path filter) count as success;
  # failed or cancelled lanes still fail the merge gate. The evm-yulc lane lives in
  # ci-yulc.yml (weekly / manual) and is not required.

  test:
    if: always()
    needs: [changes, lean, svm, evm, near, phoenix]
    runs-on: ubuntu-24.04
    steps:
      - name: Require enabled Lean, SVM, EVM, NEAR, and Phoenix lanes
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LEAN_RESULT: ${{ needs.lean.result }}
          SVM_RESULT: ${{ needs.svm.result }}
          EVM_RESULT: ${{ needs.evm.result }}
          NEAR_RESULT: ${{ needs.near.result }}
          PHOENIX_RESULT: ${{ needs.phoenix.result }}
          LEAN_ENABLED: ${{ needs.changes.outputs.lean }}
          SVM_ENABLED: ${{ needs.changes.outputs.svm }}
          EVM_ENABLED: ${{ needs.changes.outputs.evm }}
          NEAR_ENABLED: ${{ needs.changes.outputs.near }}
          PHOENIX_ENABLED: ${{ needs.changes.outputs.phoenix }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          require_lane() {
            local name="$1" enabled="$2" result="$3"
            if [ "$enabled" != "true" ]; then
              echo "$name: skipped (paths unchanged)"
              return 0
            fi
            echo "$name: $result"
            test "$result" = success
          }
          require_lane Lean "$LEAN_ENABLED" "$LEAN_RESULT"
          require_lane SVM "$SVM_ENABLED" "$SVM_RESULT"
          require_lane EVM "$EVM_ENABLED" "$EVM_RESULT"
          require_lane NEAR "$NEAR_ENABLED" "$NEAR_RESULT"
          require_lane Phoenix "$PHOENIX_ENABLED" "$PHOENIX_RESULT"
